<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet">

    <title>Editar Evento</title>
</head>

<body>

    <main class="container">

        <div class="topo">
            <a href="evento.html">
                <i class='bx bx-arrow-back'></i>
            </a>

            <h1>Editar Evento</h1>
        </div>

        <form>

            <div class="campo">
                <label>Nome do evento</label>
                <input type="text" value="Festa Junina da Empresa">
            </div>

            <div class="campo">
                <label>Descrição</label>
                <textarea>Evento comemorativo com comidas típicas, música ao vivo e brincadeiras.</textarea>
            </div>

            <div class="campo">
                <label>Data</label>
                <input type="date" value="2026-06-20">
            </div>

            <div class="campo">
                <label>Local</label>
                <input type="text" value="Salão Principal - São Paulo">
            </div>

            <div class="campo">
                <label>Criador</label>
                <input type="text" value="Kauany Araujo">
            </div>

            <button type="button" onclick="window.location.href='evento.html'">
                Salvar alterações
            </button>

        </form>

    </main>

</body>

</html>
